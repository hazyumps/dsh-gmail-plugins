# dsh-plugin-gmail — bundle patch for DeepSeek Harness 0.2.
#
# A top-level YAML array of loader patch entries. The bundle row is inserted
# with defaults; the Settings page (or the profile's own patch) can edit the
# config afterwards.
#
# The plugin publishes no services — it registers into the host `tools`
# registry and optionally consumes `timer` for polling triggers — so it needs
# no isolate realm and sits loose here, like the shipped tool bundles.
#
# Secrets are references resolved per operation through ctx.credentials
# (provider store, process env, .env) — never literal tokens. Literal
# clientId/clientSecret/refreshToken are also accepted and take precedence.

- insert:
    - id: gmail
      name: dsh-plugin-gmail
      config:
        clientIdRef: GMAIL_CLIENT_ID
        clientSecretRef: GMAIL_CLIENT_SECRET
        refreshTokenRef: GMAIL_REFRESH_TOKEN
        defaultUserId: me
        timeoutMs: 30000
        enableReceivedTrigger: false
        enableSentTrigger: false
        triggerIntervalMinutes: 5
        receivedQuery: 'in:inbox newer_than:1d'
        sentQuery: 'in:sent newer_than:1d'
        redirectPort: 8765
        # Filesystem roots an attachment path or save_path may touch. Empty
        # means the Harness process working directory.
        allowedRoots: []
