# Mount the Gmail tools inside an AGENT PRESET instead of the whole profile.
#
# The plugin publishes no services, so it needs no `cordis:group` with an
# `isolate` realm. Add this row to the preset's agent.cordis.yml when only
# agents on that preset should see gmail_* tools. Installing the bundle
# normally (dsh plugin add) already puts the row in the profile patch.

- id: gmail
  name: dsh-plugin-gmail
  config:
    clientIdRef: GMAIL_CLIENT_ID
    clientSecretRef: GMAIL_CLIENT_SECRET
    refreshTokenRef: GMAIL_REFRESH_TOKEN
    defaultUserId: me
    timeoutMs: 30000
    allowedRoots: []
    enableReceivedTrigger: false
    enableSentTrigger: false
